site_name: nomad-ml-workflows
site_description: A plugin containing curated NOMAD Actions.
site_author: Sarthak Kapoor

repo_url: https://github.com/FAIRmat-NFDI/nomad-ml-workflows
edit_uri: ""

nav:
  - Home: index.md
  - Export Entries tutorial: tutorial/tutorial.md
  - How-to guides:
      - Install this Plugin: how_to/install_this_plugin.md
      - Use this Plugin: how_to/use_this_plugin.md
      - Export entries: how_to/export_entries.md
      - Export energies, forces, and stresses: how_to/export_forces.md
      - Export remote entries: how_to/export_remote_entries.md
      - Contribute to this plugin: how_to/contribute_to_this_plugin.md
  - Explanation:
      - Export functionality: explanation/export_entries.md
      - Schema: explanation/schema.md
plugins:
  - search
theme:
  name: material
  palette:
    # 1. Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # 2. Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
    # 3. Auto
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
  font:
    text: "Titillium Web"
  logo: assets/nomad-plugin-logo.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: True
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - mkdocs-click
  - pymdownx.extra
extra:
  generator: false
  homepage: https://fairmat-nfdi.github.io/nomad-ml-workflows/
use_directory_urls: false
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/theme-video.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
